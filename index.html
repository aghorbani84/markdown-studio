<!doctype html>
<html lang="en" data-style="modern" data-mode="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown Studio v2 — Live Markdown Editor &amp; Preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint (no white flash).
      (function () {
        try {
          var style = localStorage.getItem('showcase-style');
          if (style !== 'achaemenid' && style !== 'modern') style = 'modern';
          var mode = localStorage.getItem('showcase-mode');
          if (mode !== 'light' && mode !== 'dark') {
            mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.style = style;
          document.documentElement.dataset.mode = mode;
          document.documentElement.dataset.theme = mode;
        } catch (e) {
          /* storage unavailable — defaults in the markup stand */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
